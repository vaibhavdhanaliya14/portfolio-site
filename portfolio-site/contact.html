<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Portfolio | Contact</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">SoftNexis<span>.dev</span></a>
      <button class="hamburger" id="hamburger-btn" aria-label="Toggle Navigation">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="container page-content">
    <section class="contact-section">
      <h1>Contact Me</h1>
      <p>Have a question or want to collaborate? Send a message below.</p>
      
      <form id="contact-form" class="contact-form" novalidate>
        <div id="form-alert" class="alert hidden"></div>
        
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="john@example.com" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Your message..." required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 SoftNexis Intern Portfolio. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
